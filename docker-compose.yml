services:
  cryptoproof:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENT_MODE: ${AGENT_MODE:-demo}
      RAG_MODE: ${RAG_MODE:-sparse}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      DATA_DIR: /app/data
      TERMS_FILE: knowledge/crypto_terms_zh.txt
      TERM_CANDIDATE_LIMIT: ${TERM_CANDIDATE_LIMIT:-5}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-12}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      GENERATION_BASE_URL: ${GENERATION_BASE_URL:-}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
