[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoproof-agent"
version = "0.1.0"
description = "Agentic Chinese cryptography terminology proofreading with LangGraph, RAG and human review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["cryptoproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
